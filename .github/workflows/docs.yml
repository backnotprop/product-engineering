name: docs
# The docs site is generated from the repository it documents: docs/scripts/sync-data.py
# reads the skills, the manifest, the ledger, and NOTICE and writes the data and the
# generated pages. This job fails when the committed data is stale, then builds and
# lints the site.
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs data is in sync with the repo
        run: python3 docs/scripts/sync-data.py --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docs
        run: pnpm build
      - name: Lint content
        working-directory: docs
        run: pnpm lint:docs
